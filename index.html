<style>
.loader {
	display:none;
	border: 8px solid #f3f3f3; /* Light grey */
	border-top: 8px solid #3498db; /* Blue */
	border-radius: 50%;
	width: 20px;
	height: 20px;
	animation: spin 0.5s linear infinite;
}
@keyframes spin {
	0% { transform: rotate(0deg); }
	100% { transform: rotate(360deg); }
}
</style>

<script>
	let card=null;
	let questValueDiv=null;
	let cardValueDiv=null;
	function randomIn(anArray)
	{
		return anArray[Math.floor(Math.random()*anArray.length)];
	}
	function setValue(id,value)
	{
		card.getElementById(id).firstChild.firstChild.textContent=value;
	}
	function adjustQuestValueDiv()
	{
		let boundingBox=card.getElementById('questValue').getBoundingClientRect();
		let ctm=card.getElementById('questValue').getCTM();
		questValueDiv.style.padding='0.3em 0.3em 0.3em 0.3em';
		questValueDiv.style.left=boundingBox.x+"px";
		questValueDiv.style.top=boundingBox.y+"px";
		questValueDiv.style.width=(boundingBox.width-20)+"px";
		questValueDiv.style.height=(boundingBox.height-15)+"px";
		questValueDiv.style.fontSize=(boundingBox.height/2.5|0)+"px";
	}
	function adjustCardValueDiv()
	{
		let boundingBox=card.getElementById('cardValue').getBoundingClientRect();
		let ctm=card.getElementById('cardValue').getCTM();
		cardValueDiv.style.padding='0.5em 0.5em 0.5em 0.5em';
		cardValueDiv.style.left=(boundingBox.x-6)+"px";
		cardValueDiv.style.top=(boundingBox.y-2)+"px";
		cardValueDiv.style.width=(boundingBox.width+4)+"px";
		cardValueDiv.style.height=(boundingBox.height)+"px";
		cardValueDiv.style.fontSize=(boundingBox.height/5)+"px";
	}
	function shuffle(timeout)
	{
		randomizeCards();
		if(timeout>0)
		{
			setTimeout(()=>{
				setTimeout(()=>{shuffle(timeout-1);},timeout);
			},10);
		}
	}
	function randomizeCards()
	{
		let tmp;
		let langValues=values[userLang];
		let oracleEven=randomIn(langValues['d6'])-1;
		let oracleBad=Math.max(randomIn(langValues['d6'])-2,0);
		let oracleGood=Math.min(randomIn(langValues['d6']),5);
		setValue('oracleBadValue',langValues['oracle'][oracleBad]);
		setValue('oracleEvenValue',langValues['oracle'][oracleEven]);
		setValue('oracleGoodValue',langValues['oracle'][oracleGood]);
		setValue('difficultyValue',randomIn(langValues['difficulty']));
		setValue('d4Value',randomIn(langValues['d4']));
		setValue('d6Value',randomIn(langValues['d6']));
		setValue('d8Value',randomIn(langValues['d8']));
		setValue('d10Value',randomIn(langValues['d10']));
		setValue('d12Value',randomIn(langValues['d12']));
		setValue('d20Value',randomIn(langValues['d20']));
		setValue('roomValue',randomIn(langValues['room']));
		setValue('exitValue',randomIn(langValues['exit']));
		setValue('contentValue',randomIn(langValues['content']));
		setValue('conditionValue',randomIn(langValues['condition']));
		setValue('itemValue',randomIn(langValues['item']));
		setValue('adjectiveValue',randomIn(langValues['adjective']));
		setValue('nameValue',randomIn(langValues['name']));
		setValue('colorValue',randomIn(langValues['color']));
		setValue('npcValue',randomIn(langValues['npc']));
		setValue('encounterValue',randomIn(langValues['encounter']));
		setValue('combatValue',randomIn(langValues['combat']));
		setValue('placeValue',randomIn(langValues['place']));
		questValueDiv.innerHTML=randomIn(langValues['quest']);
		let cardValue=randomIn(langValues['card']);
		cardValueDiv.innerHTML='<img src="cards/'+cardValue+'">';
		setValue('systemValue',randomIn(langValues['system']));
		setValue('planetValue',randomIn(langValues['planet']));
		setValue('populationCountValue',randomIn(langValues['populationCount']));
		setValue('populationValue',randomIn(langValues['population']));
		setValue('relationshipValue',randomIn(langValues['relationship']));
		setValue('market1Value',randomIn(langValues['market1']));
		setValue('market2Value',randomIn(langValues['market2']));
		setValue('market3Value',randomIn(langValues['market3']));
		setValue('market4Value',randomIn(langValues['market4']));
		setValue('market5Value',randomIn(langValues['market5']));
	}
	function onLoad()
	{
		let supportedLanguages=Object.keys(values);
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register("serviceWorker.js");
		}
		card=document.getElementById("card");
		questValueDiv=document.createElement("div");
		questValueDiv.id='questValue';
		questValueDiv.style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Calibri;-inkscape-font-specification:'Calibri, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;text-align:center;text-anchor:middle;fill:#f2fdff;fill-opacity:1;stroke:none;stroke-width:0.2;color:#F2FDFF";
		questValueDiv.style.textAlign="left";
		questValueDiv.style.position='absolute';
		document.body.appendChild(questValueDiv);
		adjustQuestValueDiv();
		cardValueDiv=document.createElement("div");
		cardValueDiv.id='cardValue';
		cardValueDiv.style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-family:Calibri;-inkscape-font-specification:'Calibri, Normal';font-variant-ligatures:normal;font-variant-caps:normal;font-variant-numeric:normal;font-variant-east-asian:normal;text-align:center;text-anchor:middle;fill:#f2fdff;fill-opacity:1;stroke:none;stroke-width:0.2;color:#F2FDFF";
		cardValueDiv.style.textAlign="left";
		cardValueDiv.style.position='absolute';
		document.body.appendChild(cardValueDiv);
		adjustCardValueDiv();
		addEventListener("resize", (event) => {
			adjustQuestValueDiv();
			adjustCardValueDiv();
		});
		document.addEventListener('click', function(evt) {
			shuffle(10);
		}, false);
		document.addEventListener('touch', function(evt) {
			shuffle(10);
		}, false);
		document.addEventListener('keydown', function(evt) {
			shuffle(10);
		}, false);
		shuffle(0);
	}
</script>
